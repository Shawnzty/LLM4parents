<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>给爸妈的AI</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <h1>给爸妈的AI</h1>
      <div class="header-controls">
        <select id="model-select" class="model-select">
          <option value="gpt-4o">GPT-4o (推荐)</option>
        </select>
        <button id="history-btn" class="btn btn-icon" title="查看历史">📋</button>
        <button id="clear-btn" class="btn btn-icon" title="清空对话">🗑️</button>
      </div>
    </header>

    <!-- History Panel -->
    <div class="history-panel" id="history-panel" style="display: none;">
      <div class="history-header">
        <h2>📋 对话历史</h2>
        <button id="close-history-btn" class="btn-close">关闭</button>
      </div>
      <div class="history-content" id="history-content">
        <div class="history-empty">暂无历史记录</div>
      </div>
    </div>

    <!-- Chat Container -->
    <main class="chat-container" id="chat-container">
      <div class="welcome-message" id="welcome-message">
        <div class="welcome-icon">👋</div>
        <h2>欢迎使用给爸妈的AI！</h2>
        <p>我可以帮助您回答问题、写作、翻译、编程等各种任务。</p>
        <div class="quick-prompts">
          <button class="quick-prompt" data-prompt="请帮我总结一下最近一周国内外发生的重要新闻事件">
            📰 最近一周新闻
          </button>
          <button class="quick-prompt" data-prompt="请你扮演一位经验丰富的医生，我会向你描述我的症状，请给我一些建议。注意：这只是参考建议，严重情况请去医院就诊。">
            🩺 医生咨询
          </button>
          <button class="quick-prompt" data-prompt="请你扮演一位专业的营养师，根据我的情况为我制定健康的饮食建议和食谱。">
            🥗 营养师咨询
          </button>
        </div>
      </div>

      <div class="messages" id="messages"></div>
    </main>

    <!-- Input Area -->
    <footer class="input-area">
      <!-- Image Preview Area -->
      <div class="image-preview-container" id="image-preview-container" style="display: none;">
        <div class="image-previews" id="image-previews"></div>
        <button class="clear-images-btn" id="clear-images-btn" title="清除所有图片">清除图片</button>
      </div>
      <div class="input-container">
        <input type="file" id="image-input" accept="image/*" multiple style="display: none;">
        <button id="upload-btn" class="btn btn-icon" title="上传图片 (支持多张)">
          📷
        </button>
        <button id="voice-btn" class="btn btn-icon" title="语音输入 (按住说话)">
          🎤
        </button>
        <textarea
          id="user-input"
          placeholder=""
          rows="1"
        ></textarea>
        <button id="send-btn" class="btn btn-primary" title="发送消息">发送</button>
      </div>
    </footer>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loading-overlay" style="display: none;">
    <div class="loading-spinner"></div>
    <p>正在思考中...</p>
  </div>

  <!-- Error Toast -->
  <div class="toast" id="error-toast" style="display: none;"></div>

  <script src="/script.js"></script>
</body>
</html>
